<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VS Code Mobile - Final Fixed</title>

    <!-- CORE EDITOR DEPENDENCIES (CodeMirror 5 via CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/eclipse.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/fold/foldgutter.min.css">

    <style>
        /* --- VARIABLES & THEMES --- */
        :root {
            --bg-root: #1e1e1e;
            --bg-sidebar: #252526;
            --bg-activity-bar: #333333;
            --bg-editor: #1e1e1e;
            --bg-status-bar: #007acc;
            --bg-tab-active: #1e1e1e;
            --bg-tab-inactive: #2d2d2d;
            --fg-primary: #cccccc;
            --fg-secondary: #858585;
            --border-color: #3e3e42;
            --accent-color: #007acc;
            --hover-bg: #2a2d2e;
            --font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'Consolas', 'Courier New', monospace;
        }

        [data-theme="light"] {
            --bg-root: #ffffff;
            --bg-sidebar: #f3f3f3;
            --bg-activity-bar: #2c2c2c;
            --bg-editor: #ffffff;
            --bg-status-bar: #007acc;
            --bg-tab-active: #ffffff;
            --bg-tab-inactive: #ececec;
            --fg-primary: #333333;
            --fg-secondary: #616161;
            --border-color: #e4e4e4;
            --accent-color: #005fb8;
            --hover-bg: #e8e8e8;
        }

        /* --- RESET & LAYOUT --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg-root); color: var(--fg-primary); font-family: var(--font-family); font-size: 14px; }
        
        .app-container { display: flex; flex-direction: column; height: 100%; width: 100%; }
        
        /* --- TOP TOOLBAR --- */
        .toolbar { height: 45px; flex-shrink: 0; background: var(--bg-activity-bar); display: flex; align-items: center; justify-content: space-between; padding: 0 8px; border-bottom: 1px solid var(--border-color); z-index: 20; }
        .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 10px; }
        .icon-btn { background: none; border: none; cursor: pointer; padding: 6px; display: flex; align-items: center; justify-content: center; border-radius: 4px; color: #fff; transition: background 0.2s; }
        .icon-btn svg { width: 22px; height: 22px; fill: currentColor; }
        .logo { font-weight: 600; color: #fff; font-size: 16px; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; }

        /* --- MAIN WORKSPACE --- */
        .workspace { display: flex; flex: 1; overflow: hidden; position: relative; }

        /* Sidebar */
        .sidebar { width: 240px; background: var(--bg-sidebar); display: flex; flex-direction: column; border-right: 1px solid var(--border-color); transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); z-index: 30; position: relative; }
        .sidebar-header { padding: 10px 15px; font-weight: bold; text-transform: uppercase; font-size: 11px; display: flex; justify-content: space-between; align-items: center; color: var(--fg-secondary); letter-spacing: 1px; }
        .file-list { flex: 1; overflow-y: auto; list-style: none; padding: 0; margin: 0; }
        .file-item { padding: 10px 15px; cursor: pointer; display: flex; align-items: center; gap: 10px; color: var(--fg-primary); font-size: 13px; border-left: 3px solid transparent; }
        .file-item:hover { background: var(--hover-bg); }
        .file-item.active { background: var(--hover-bg); color: var(--fg-primary); border-left-color: var(--accent-color); }
        .file-item svg { width: 16px; height: 16px; fill: currentColor; opacity: 0.8; }
        
        @media (max-width: 768px) {
            .sidebar { position: absolute; height: 100%; left: -240px; box-shadow: 4px 0 15px rgba(0,0,0,0.5); }
            .sidebar.open { transform: translateX(240px); }
        }

        /* Editor Area */
        .editor-wrapper { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-editor); position: relative; }
        
        /* Empty State */
        .empty-state { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; opacity: 0.1; pointer-events: none; user-select: none; }
        .empty-state svg { width: 120px; height: 120px; fill: var(--fg-primary); margin-bottom: 20px; }
        .empty-state span { font-size: 16px; font-weight: bold; }

        /* Tabs */
        .tabs-container { height: 38px; flex-shrink: 0; background: var(--bg-sidebar); display: flex; overflow-x: auto; border-bottom: 1px solid var(--border-color); }
        .tabs-container::-webkit-scrollbar { height: 2px; }
        .tabs-container::-webkit-scrollbar-thumb { background: var(--accent-color); }
        .tab { padding: 0 15px; display: flex; align-items: center; gap: 8px; background: var(--bg-tab-inactive); color: var(--fg-secondary); cursor: pointer; border-right: 1px solid var(--border-color); min-width: fit-content; font-size: 13px; height: 100%; user-select: none; }
        .tab.active { background: var(--bg-tab-active); color: var(--fg-primary); border-top: 2px solid var(--accent-color); }
        .tab-close { margin-left: 4px; opacity: 0; border-radius: 3px; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .tab:hover .tab-close, .tab.active .tab-close { opacity: 1; }

        .tabs-container.hidden { display: none; }

        /* CodeMirror */
        #editor { flex: 1; position: relative; overflow: hidden; font-size: 14px; }
        .CodeMirror { height: 100% !important; font-family: var(--font-mono) !important; background: transparent; }
        #editor.inactive .CodeMirror { display: none; }

        /* Status Bar */
        .status-bar { height: 24px; flex-shrink: 0; background: var(--bg-status-bar); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 11px; z-index: 40; }

        /* Preview Container (Strict Layout) */
        .preview-container { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: white; 
            z-index: 9999; 
            flex-direction: column; 
        }
        .preview-container.active { display: flex; }
        
        .preview-toolbar { 
            height: 45px; 
            flex-shrink: 0;
            background: #f3f3f3; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 10px; 
            border-bottom: 1px solid #ccc; 
            color: #333; 
            font-weight: bold; 
            font-size: 14px; 
        }

        /* Iframe takes exactly remaining height */
        #preview-frame { 
            width: 100%; 
            height: calc(100% - 45px); 
            border: none; 
            display: block; 
            background: #fff;
        }

        /* Command Palette */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 200; display: none; align-items: flex-start; justify-content: center; padding-top: 40px; backdrop-filter: blur(2px); }
        .overlay.active { display: flex; }
        .cmd-palette { width: 90%; max-width: 500px; background: var(--bg-sidebar); border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; border: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .cmd-input { width: 100%; padding: 12px; background: var(--bg-root); border: none; color: var(--fg-primary); font-size: 14px; border-bottom: 1px solid var(--border-color); }
        .cmd-list { list-style: none; padding: 0; margin: 0; max-height: 250px; overflow-y: auto; }
        .cmd-item { padding: 12px 15px; border-bottom: 1px solid var(--border-color); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .cmd-item:hover { background: var(--accent-color); color: white; }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="toolbar">
            <div class="toolbar-left">
                <button class="icon-btn" id="btn-menu"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
                <div class="logo"><svg viewBox="0 0 24 24" style="fill:#007acc;"><path d="M22 11.9c0-.6-.5-1-1.3-1.3l-6.4-3.2-1.4.6v7.6l1.4.7 6.4-3.2c.8-.3 1.3-.7 1.3-1.2zm-9.1 1.8v-3.7l3.3 1.8-3.3 1.9zm-5.4 4l-1.8-.9L2 12l3.8-4.8 1.8 1-3 3.8 2.9 3.7zM10.1 7L8.3 6l3.7-4.8 1.8.9L10.1 7zm3.7 10l-1.8 1L8.3 13l1.8-.9 3.7 4.9z"/></svg>VS Code Mobile</div>
            </div>
            <div class="toolbar-right">
                <button class="icon-btn" id="btn-run"><svg viewBox="0 0 24 24" style="fill: #4caf50;"><path d="M8 5v14l11-7z"/></svg></button>
                <button class="icon-btn" id="btn-theme"><svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg></button>
                <button class="icon-btn" id="btn-palette"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg></button>
            </div>
        </header>

        <div class="workspace">
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header"><span>Explorer</span><div><button class="icon-btn" id="btn-new-file" style="color:var(--fg-secondary)"><svg viewBox="0 0 24 24" style="width:20px;height:20px;"><path d="M13 9h5.5L13 3.5V9zM6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 18h12v-8l-4-4H6v12z"/></svg></button><button class="icon-btn" id="btn-import" style="color:var(--fg-secondary)"><svg viewBox="0 0 24 24" style="width:20px;height:20px;"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg></button></div></div>
                <ul class="file-list" id="file-list"></ul>
                <input type="file" id="file-input" style="display: none;">
            </aside>
            <div class="editor-wrapper">
                <div class="tabs-container hidden" id="tabs"></div>
                <div class="empty-state" id="empty-state"><svg viewBox="0 0 24 24"><path d="M22 11.9c0-.6-.5-1-1.3-1.3l-6.4-3.2-1.4.6v7.6l1.4.7 6.4-3.2c.8-.3 1.3-.7 1.3-1.2zm-9.1 1.8v-3.7l3.3 1.8-3.3 1.9zm-5.4 4l-1.8-.9L2 12l3.8-4.8 1.8 1-3 3.8 2.9 3.7zM10.1 7L8.3 6l3.7-4.8 1.8.9L10.1 7zm3.7 10l-1.8 1L8.3 13l1.8-.9 3.7 4.9z"/></svg><span>No File Open</span></div>
                <div id="editor" class="inactive"></div>
            </div>
        </div>
        <footer class="status-bar"><div id="status-msg">Ready</div><div id="status-lang">UTF-8</div></footer>
    </div>

    <!-- PREVIEW PANEL -->
    <div class="preview-container" id="preview-panel">
        <div class="preview-toolbar">
            <span>Live Preview</span>
            <button class="icon-btn" id="btn-close-preview" style="color:#333"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
        </div>
        <iframe id="preview-frame"></iframe>
    </div>

    <!-- CMD OVERLAY -->
    <div class="overlay" id="cmd-overlay">
        <div class="cmd-palette">
            <input type="text" class="cmd-input" id="cmd-input" placeholder="> Type a command...">
            <ul class="cmd-list" id="cmd-list"></ul>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/matchbrackets.min.js"></script>

    <script>
        const FileManager = {
            files: {}, activeFileId: null,
            init() {
                const saved = localStorage.getItem('vscode_files_v4');
                if (saved) this.files = JSON.parse(saved);
                else this.files = { 'index.html': { content: '<div class="box">Hello!</div>', type: 'htmlmixed' }, 'style.css': { content: 'body{background:#000;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}.box{font-size:30px;}', type: 'css' } };
            },
            saveToStorage() { localStorage.setItem('vscode_files_v4', JSON.stringify(this.files)); },
            createFile(name, content='') {
                let n=name, c=1; while(this.files[n]) { n = name.includes('.') ? name.replace('.',`_${c}.`) : `${name}_${c}`; c++; }
                this.files[n] = { content, type: this.detectType(n) }; this.saveToStorage(); return n;
            },
            deleteFile(n) { if(this.files[n]) { delete this.files[n]; this.saveToStorage(); } },
            detectType(n) { const e=n.split('.').pop().toLowerCase(); return ({'html':'htmlmixed','js':'javascript','css':'css','py':'python'})[e]||'null'; }
        };

        const EditorManager = {
            instance: null,
            init() {
                this.instance = CodeMirror(document.getElementById('editor'), { lineNumbers: true, theme: 'dracula', mode: 'htmlmixed', autoCloseBrackets: true, matchBrackets: true });
                this.instance.on('change', () => { if (FileManager.activeFileId) { FileManager.files[FileManager.activeFileId].content = this.instance.getValue(); FileManager.saveToStorage(); }});
            },
            openFile(n) {
                if (!FileManager.files[n]) return;
                FileManager.activeFileId = n;
                document.getElementById('editor').classList.remove('inactive');
                this.instance.setValue(FileManager.files[n].content);
                this.instance.setOption('mode', FileManager.files[n].type);
                setTimeout(() => this.instance.refresh(), 1);
                UIManager.renderTabs(); UIManager.renderSidebar(); UIManager.updateStatus(n, FileManager.files[n].type);
            },
            closeCurrent() { FileManager.activeFileId = null; document.getElementById('editor').classList.add('inactive'); this.instance.setValue(''); UIManager.updateStatus("No File", ""); }
        };

        const UIManager = {
            openTabs: [],
            init() {
                const keys = Object.keys(FileManager.files);
                if (keys.length > 0) { if (keys.includes('index.html')) this.openTabs.push('index.html'); else this.openTabs.push(keys[0]); EditorManager.openFile(this.openTabs[0]); }
                this.renderSidebar(); this.renderTabs(); this.bindEvents();
            },
            bindEvents() {
                const sb = document.getElementById('sidebar');
                document.getElementById('btn-menu').onclick = () => sb.classList.toggle('open');
                document.onclick = (e) => { if(window.innerWidth<=768 && sb.classList.contains('open') && !sb.contains(e.target) && !e.target.closest('#btn-menu')) sb.classList.remove('open'); };
                document.getElementById('btn-theme').onclick = () => { const b=document.body; if(b.hasAttribute('data-theme')) { b.removeAttribute('data-theme'); EditorManager.instance.setOption('theme','dracula'); } else { b.setAttribute('data-theme','light'); EditorManager.instance.setOption('theme','eclipse'); } };
                document.getElementById('btn-new-file').onclick = () => { const n=prompt("Name:"); if(n) { const f=FileManager.createFile(n); this.openTab(f); } };
                document.getElementById('btn-run').onclick = () => ExecutionManager.run();
                document.getElementById('btn-close-preview').onclick = () => document.getElementById('preview-panel').classList.remove('active');
                document.getElementById('btn-palette').onclick = () => { document.getElementById('cmd-overlay').classList.add('active'); document.getElementById('cmd-input').focus(); this.filterCmds(''); };
                document.getElementById('cmd-overlay').onclick = (e) => { if(e.target.id==='cmd-overlay') e.target.classList.remove('active'); };
                document.getElementById('cmd-input').oninput = (e) => this.filterCmds(e.target.value);
                document.getElementById('file-input').onchange = (e) => { const f=e.target.files[0]; if(f) { const r=new FileReader(); r.onload=(ev)=>{ FileManager.createFile(f.name, ev.target.result); this.openTab(f.name); }; r.readAsText(f); } };
                document.getElementById('btn-import').onclick = () => document.getElementById('file-input').click();
            },
            filterCmds(q) {
                const l=document.getElementById('cmd-list'); l.innerHTML='';
                [{name:'New File',a:()=>document.getElementById('btn-new-file').click()},{name:'Run',a:()=>ExecutionManager.run()},{name:'Theme',a:()=>document.getElementById('btn-theme').click()}]
                .filter(c=>c.name.toLowerCase().includes(q.toLowerCase())).forEach(c=>{ const i=document.createElement('li'); i.className='cmd-item'; i.textContent=c.name; i.onclick=()=>{document.getElementById('cmd-overlay').classList.remove('active');c.a();}; l.appendChild(i); });
            },
            renderSidebar() {
                const l=document.getElementById('file-list'); l.innerHTML='';
                Object.keys(FileManager.files).sort().forEach(n => {
                    const i=document.createElement('li'); i.className=`file-item ${FileManager.activeFileId===n?'active':''}`;
                    i.innerHTML=`<svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg><span>${n}</span>`;
                    i.onclick=()=>this.openTab(n); i.oncontextmenu=(e)=>{e.preventDefault();if(confirm('Delete?')){this.closeTab(n);FileManager.deleteFile(n);this.renderSidebar();}};
                    l.appendChild(i);
                });
            },
            renderTabs() {
                const c=document.getElementById('tabs'); c.innerHTML='';
                if(this.openTabs.length===0){c.classList.add('hidden');document.getElementById('empty-state').style.display='flex';return;}
                c.classList.remove('hidden'); document.getElementById('empty-state').style.display='none';
                this.openTabs.forEach(n=>{
                    const d=document.createElement('div'); d.className=`tab ${FileManager.activeFileId===n?'active':''}`; d.innerHTML=`<span>${n}</span><span class="tab-close">&times;</span>`;
                    d.onclick=()=>EditorManager.openFile(n); d.querySelector('.tab-close').onclick=(e)=>{e.stopPropagation();this.closeTab(n);}; c.appendChild(d);
                });
            },
            openTab(n) { if(!this.openTabs.includes(n))this.openTabs.push(n); EditorManager.openFile(n); if(window.innerWidth<768)document.getElementById('sidebar').classList.remove('open'); },
            closeTab(n) {
                const i=this.openTabs.indexOf(n); if(i>-1)this.openTabs.splice(i,1);
                if(this.openTabs.length===0) EditorManager.closeCurrent(); else if(FileManager.activeFileId===n) EditorManager.openFile(this.openTabs[i]||this.openTabs[i-1]);
                this.renderTabs(); this.renderSidebar();
            },
            updateStatus(f,t) { document.getElementById('status-msg').textContent=f; document.getElementById('status-lang').textContent=(t==='null'?'TXT':t).toUpperCase(); }
        };

        const ExecutionManager = {
            run() {
                document.getElementById('preview-panel').classList.add('active');
                const iframe = document.getElementById('preview-frame');
                
                // Get content
                let html = FileManager.files['index.html']?.content || '';
                if(FileManager.activeFileId && FileManager.activeFileId.endsWith('.html')) html = FileManager.files[FileManager.activeFileId].content;
                if(!html && FileManager.activeFileId.endsWith('.js')) html = `<html><body><script>${FileManager.files[FileManager.activeFileId].content}<\/script></body></html>`;
                
                const css = FileManager.files['style.css']?.content || '';

                // --- FIX: Inject Global Reset CSS to remove white gaps ---
                const resetCSS = "<style>body,html{margin:0;padding:0;width:100%;height:100%;overflow-x:hidden;box-sizing:border-box;} *{box-sizing:border-box;}</style>";

                if(html.includes('<head>')) html = html.replace('<head>', `<head>${resetCSS}<style>${css}</style>`);
                else html = `${resetCSS}<style>${css}</style>${html}`;

                const blob = new Blob([html], {type: 'text/html'});
                iframe.src = URL.createObjectURL(blob);
            }
        };

        window.onload = () => { FileManager.init(); EditorManager.init(); UIManager.init(); };
    </script>
</body>
</html>
